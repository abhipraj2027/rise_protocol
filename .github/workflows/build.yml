name: Build Android APK

# Runs on every push to main/master, on every pull request (so you catch
# build breaks before merging), and manually from the Actions tab ("Run
# workflow") whenever you just want a fresh APK without pushing new code.
on:
  push:
    branches: [main, master, 'redesign/**', 'preview/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Flutter's Android build needs a JDK. 17 matches what current
      # Android Gradle Plugin versions expect.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Pin a specific Flutter version so builds are reproducible instead of
      # silently picking up whatever "stable" means on a given day. Bump
      # this deliberately when you upgrade Flutter locally.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # The GitHub-hosted runner ships an Android SDK, but make sure the
      # platform/build-tools this project targets are present and licensed
      # so the Gradle build doesn't stop to prompt.
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      # Fails the build on lint/type errors instead of letting them slide
      # through to a broken APK. Output is also mirrored into the job summary
      # and uploaded as an artifact so failures can be inspected without
      # repo-admin access to the raw run log.
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.txt || status=$?
          {
            echo '### flutter analyze'
            echo '```'
            cat analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: analyze.txt
          retention-days: 7

      # --split-per-abi emits one APK per CPU architecture (~17 MB for
      # arm64-v8a, which is every modern phone) instead of one ~48 MB fat
      # APK. A universal APK is also built for maximum-compatibility
      # sideloading.
      - name: Build release APKs
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.txt || status=$?
          flutter build apk --release 2>&1 | tee -a build.txt || status=$?
          tail -c 60000 build.txt >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.txt
          retention-days: 7

      # Makes the APKs downloadable from the workflow run's "Artifacts"
      # section in the GitHub UI, kept for 14 days. app-release.apk is the
      # universal build; app-arm64-v8a-release.apk is the small one for
      # modern phones.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rise-protocol-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14
