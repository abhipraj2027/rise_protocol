name: Build Android APK

# Runs on every push to main/master, on every pull request (so you catch
# build breaks before merging), and manually from the Actions tab ("Run
# workflow") whenever you just want a fresh APK without pushing new code.
on:
  push:
    branches: [main, master, 'redesign/**', 'preview/**', 'premium/**', 'playstore/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed so the master build can publish the APKs to the "latest" release.
    permissions:
      contents: write

    # Release signing (see android/app/build.gradle). Empty strings when the
    # secrets below aren't set yet — Gradle treats that as "not configured"
    # and falls back to debug signing, so this is safe before the keystore
    # secret exists.
    env:
      RELEASE_STORE_FILE: app/release.p12
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Flutter's Android build needs a JDK. 17 matches what current
      # Android Gradle Plugin versions expect.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Pin a specific Flutter version so builds are reproducible instead of
      # silently picking up whatever "stable" means on a given day. Bump
      # this deliberately when you upgrade Flutter locally.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # The GitHub-hosted runner ships an Android SDK, but make sure the
      # platform/build-tools this project targets are present and licensed
      # so the Gradle build doesn't stop to prompt.
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      # Puts the real keystore at the path RELEASE_STORE_FILE (above) points
      # to, only if the secret has been added. Absent the secret, this is
      # skipped entirely and every build stays debug-signed.
      - name: Decode release keystore
        if: env.RELEASE_STORE_PASSWORD != ''
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.p12

      - name: Install dependencies
        run: flutter pub get

      # Fails the build on lint/type errors instead of letting them slide
      # through to a broken APK. Output is also mirrored into the job summary
      # and uploaded as an artifact so failures can be inspected without
      # repo-admin access to the raw run log.
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.txt || status=$?
          {
            echo '### flutter analyze'
            echo '```'
            cat analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: analyze.txt
          retention-days: 7

      # --split-per-abi emits one APK per CPU architecture (~17 MB for
      # arm64-v8a, which is every modern phone) instead of one ~48 MB fat
      # APK. A universal APK is also built for maximum-compatibility
      # sideloading.
      - name: Build release APKs
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.txt || status=$?
          flutter build apk --release 2>&1 | tee -a build.txt || status=$?
          tail -c 60000 build.txt >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.txt
          retention-days: 7

      # Makes the APKs downloadable from the workflow run's "Artifacts"
      # section in the GitHub UI, kept for 14 days. app-release.apk is the
      # universal build; app-arm64-v8a-release.apk is the small one for
      # modern phones.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rise-protocol-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

      # The App Bundle is the format Play Console actually requires (APKs
      # above are for sideloading/testing only). Signed with the real
      # release keystore when it's configured (see the env block up top),
      # debug-signed otherwise — so this keeps building either way.
      - name: Build App Bundle
        run: |
          set -o pipefail
          flutter build appbundle --release 2>&1 | tee aab_build.txt || status=$?
          {
            echo '### flutter build appbundle'
            echo '```'
            tail -c 60000 aab_build.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: rise-protocol-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Publishes the APKs to a rolling "latest" prerelease so there's a
      # stable, no-login, phone-installable link:
      #   https://github.com/abhipraj2027/rise_protocol/releases/latest
      - name: Publish APKs to the 'latest' release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest master build
          prerelease: true
          body: >
            Auto-published from the master CI build (${{ github.sha }}).
            Debug-signed — for sideloading and testing only.
            app-arm64-v8a-release.apk is the one for modern phones.
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
